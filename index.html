<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kankan Engins</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#2b362a;--panel:#364232;--text:#f1ebdd;--muted:#c4bfa9;--accent:#e8a317;--ink:#231c05;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1{font:800 clamp(2.2rem,9vw,3.2rem)/1 Archivo,Arial,sans-serif;margin:8px 0 12px;letter-spacing:-.02em}
h2{font:800 1.3rem/1.2 Archivo,Arial,sans-serif;margin:32px 0 12px}
.lead{color:var(--muted);margin:0 0 8px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.services button{font:600 1rem/1.25 "Source Sans 3",sans-serif;text-align:left;min-height:64px;padding:12px;border:2px solid #536150;border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer}
.services button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--ink)}
label{display:block;margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:2px solid #536150;border-radius:10px;padding:12px}
textarea{min-height:88px;resize:vertical}
input[type="date"]{display:block;min-width:0;max-width:100%;min-height:52px;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.send{margin-top:22px;width:100%;font:800 1.1rem Archivo,Arial,sans-serif;padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--ink);cursor:pointer}
#msg{min-height:1.5em;margin-top:12px;color:var(--accent);font-weight:600}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.gal figure{margin:0;background:var(--panel);border-radius:10px;overflow:hidden}
.gal figure:first-child{grid-column:1/-1}
.gal img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover}
.gal figcaption{padding:8px 12px;font-weight:600}
</style>
</head>
<body>
<main>

  <h2>Quel service ?</h2>
  <div class="services" id="services">
    <button type="button" aria-pressed="false">Location de chargeur</button>
    <button type="button" aria-pressed="false">Location de camion</button>
    <button type="button" aria-pressed="false">Livraison de sable</button>
    <button type="button" aria-pressed="false">Livraison de gravier</button>
    <button type="button" aria-pressed="false">Dégagement de route</button>
    <button type="button" aria-pressed="false">Étalement de terrain</button>
  </div>

  <h2>Votre demande</h2>
  <label for="nom">Votre nom</label>
  <input id="nom" autocomplete="name">
  <label for="tel">Votre téléphone</label>
  <input id="tel" type="tel" autocomplete="tel">
  <label for="lieu">Lieu du travail</label>
  <input id="lieu" placeholder="Quartier, village, route…">
  <label for="date">Date souhaitée</label>
  <input id="date" type="date">
  <label for="det">Détails (quantité, durée…)</label>
  <textarea id="det"></textarea>

  <button class="send" id="send" type="button">Envoyer la demande sur WhatsApp</button>
  <div id="msg" role="status"></div>
  <p style="margin:32px 0 0;padding-top:18px;border-top:2px solid #536150;font-weight:600">Pour appeler directement : <a href="tel:+224627941741" style="color:var(--accent)">627 94 17 41</a></p>
</main>
<script>
// Mettez ici votre numéro WhatsApp avec l’indicatif, sans + ni espaces (ex. : "224620000000").
var NUMERO = "224627941741";
var service = "";
var boutons = document.querySelectorAll("#services button");
boutons.forEach(function(b){
  b.addEventListener("click", function(){
    boutons.forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    b.setAttribute("aria-pressed","true");
    service = b.textContent;
  });
});
document.getElementById("send").addEventListener("click", function(){
  var msg = document.getElementById("msg");
  var nom = document.getElementById("nom").value.trim();
  var tel = document.getElementById("tel").value.trim();
  var lieu = document.getElementById("lieu").value.trim();
  if(!service){ msg.textContent = "Choisissez d’abord un service."; return; }
  if(!nom || !tel || !lieu){ msg.textContent = "Indiquez votre nom, votre téléphone et le lieu."; return; }
  var texte = "Bonjour, je voudrais : " + service +
    "\nNom : " + nom + "\nTéléphone : " + tel + "\nLieu : " + lieu +
    "\nDate : " + (document.getElementById("date").value || "à discuter") +
    "\nDétails : " + (document.getElementById("det").value.trim() || "—");
  var base = NUMERO ? "https://wa.me/" + NUMERO : "https://wa.me/";
  msg.textContent = "Ouverture de WhatsApp…";
  window.open(base + "?text=" + encodeURIComponent(texte), "_blank");
});
</script>
